<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Editor Pro (Render Mulus)</title>
    
    <script src="coi-serviceworker.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    
    <style>
        :root {
            --bg-main: #121212; --bg-panel: #1e1e1e; --bg-timeline: #151515;
            --accent: #2563eb; --accent-green: #16a34a; --accent-yellow: #ca8a04;
            --text-main: #e0e0e0; --text-muted: #888;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        header { background-color: var(--bg-panel); padding: 12px 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        
        .workspace { display: flex; flex: 1; padding: 10px; gap: 10px; height: calc(100vh - 250px); }
        .preview-section { flex: 3; background-color: #000; border-radius: 8px; display: flex; justify-content: center; align-items: center; border: 1px solid #333; position: relative; }
        video { max-width: 100%; max-height: 100%; border-radius: 8px; }
        
        .tools-section { flex: 1; background-color: var(--bg-panel); padding: 20px; border-radius: 8px; border: 1px solid #333; overflow-y: auto; }
        h3 { margin-top: 0; font-size: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; color: #60a5fa; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: var(--text-muted); }
        .input-group input[type="number"] { width: 90%; padding: 8px; background-color: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; }
        
        button { width: 100%; background-color: var(--accent); color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; transition: 0.2s; }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; }
        .btn-green { background-color: var(--accent-green); margin-top: 10px; }
        .btn-green:hover { background-color: #15803d; }
        .btn-yellow { background-color: var(--accent-yellow); margin-top: 15px; }
        .btn-yellow:hover { background-color: #a16207; }
        
        #statusBox { margin-top: 15px; padding: 10px; background-color: #2a2a2a; border-radius: 4px; font-size: 12px; color: #4ade80; }
        
        .timeline-section { height: 220px; background-color: var(--bg-timeline); border-top: 1px solid #333; display: flex; flex-direction: column; }
        .timeline-header { padding: 10px 20px; background: #1a1a1a; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .timeline-title { font-size: 13px; font-weight: bold; color: var(--text-muted); }
        .btn-add { background: #3b82f6; width: auto; padding: 5px 15px; font-size: 12px; margin: 0; }
        
        .track-container { flex: 1; padding: 15px 20px; overflow-x: auto; overflow-y: hidden; display: flex; align-items: center; }
        .track { height: 80px; display: flex; gap: 10px; align-items: center; min-width: 100%; padding-right: 50px; }
        
        .clip-item { height: 100%; min-width: 120px; background-color: #2563eb; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; border: 2px solid transparent; cursor: grab; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s; }
        .clip-item:active { cursor: grabbing; transform: scale(0.98); }
        .clip-item.selected { border-color: #fff; background-color: #1d4ed8; }
        .clip-item.playing { border-color: #fde047; background-color: #a16207; }
        .clip-item.dragging { opacity: 0.4; border: 2px dashed #fff; }
        
        .clip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px; font-weight: bold; pointer-events: none; }
        .delete-btn { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.5); color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; }
        .delete-btn:hover { background: #ef4444; }
    </style>
</head>
<body>

    <header>
        <div>🎬 Web Editor Pro (Render Mulus)</div>
        <a id="downloadBtn" href="#" style="display:none; background:#16a34a; padding:6px 15px; border-radius:4px; text-decoration:none; color:white; font-size:14px;">⬇️ Unduh Hasil Akhir</a>
    </header>

    <div class="workspace">
        <div class="preview-section">
            <video id="videoPreview" controls></video>
        </div>
        
        <div class="tools-section">
            <h3>✂️ Edit Klip Terpilih</h3>
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>Mulai (Detik)</label>
                    <input type="number" id="startTime" value="0" min="0">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Akhir (Detik)</label>
                    <input type="number" id="endTime" value="10" min="1">
                </div>
            </div>
            <button id="btnCut" disabled>Potong Klip Ini</button>

            <button id="btnPreviewAll" class="btn-yellow">▶️ Play Semua (Preview)</button>
            <button id="btnMerge" class="btn-green">🔗 Render & Gabung Semua Video</button>
            
            <div id="statusBox">Status: Siap! Masukkan video ke timeline.</div>
        </div>
    </div>

    <div class="timeline-section">
        <div class="timeline-header">
            <span class="timeline-title">TIMELINE VIDEO</span>
            <input type="file" id="uploadTimeline" accept="video/mp4, video/mov" multiple style="display: none;">
            <button class="btn-add" onclick="document.getElementById('uploadTimeline').click()">➕ Tambah Video</button>
        </div>
        <div class="track-container">
            <div class="track" id="mainTrack"></div>
        </div>
    </div>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });
        
        let timelineFiles = []; 
        let selectedIndex = null; 
        let draggedIndex = null;
        let isPreviewingSequence = false;
        let currentSequenceIndex = 0;

        const mainTrack = document.getElementById('mainTrack');
        const uploadTimeline = document.getElementById('uploadTimeline');
        const videoPreview = document.getElementById('videoPreview');
        const btnCut = document.getElementById('btnCut');
        const btnMerge = document.getElementById('btnMerge');
        const btnPreviewAll = document.getElementById('btnPreviewAll');
        const statusBox = document.getElementById('statusBox');
        const downloadBtn = document.getElementById('downloadBtn');

        uploadTimeline.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                timelineFiles = timelineFiles.concat(files);
                renderTimeline();
                statusBox.innerText = `Status: ${files.length} video ditambahkan.`;
            }
            uploadTimeline.value = ""; 
        });

        function renderTimeline() {
            mainTrack.innerHTML = '';
            
            if(timelineFiles.length === 0) {
                mainTrack.innerHTML = '<span style="color:#555; font-size:12px; font-style:italic;">Timeline kosong. Klik "+ Tambah Video".</span>';
                videoPreview.src = "";
                btnCut.disabled = true;
                return;
            }

            timelineFiles.forEach((file, index) => {
                const clip = document.createElement('div');
                clip.className = `clip-item ${index === selectedIndex ? 'selected' : ''}`;
                if (isPreviewingSequence && index === currentSequenceIndex) clip.classList.add('playing');
                
                clip.draggable = true;
                clip.innerHTML = `<div class="clip-name">🎞️ ${file.name}</div><div class="delete-btn" title="Hapus">X</div>`;

                clip.addEventListener('click', (e) => {
                    if (e.target.className !== 'delete-btn') {
                        isPreviewingSequence = false;
                        selectedIndex = index;
                        videoPreview.src = URL.createObjectURL(file);
                        btnCut.disabled = false;
                        renderTimeline();
                    }
                });

                clip.querySelector('.delete-btn').addEventListener('click', () => {
                    timelineFiles.splice(index, 1);
                    if (selectedIndex === index) selectedIndex = null;
                    renderTimeline();
                });

                clip.addEventListener('dragstart', () => { draggedIndex = index; setTimeout(() => clip.classList.add('dragging'), 0); });
                clip.addEventListener('dragend', () => clip.classList.remove('dragging'));
                clip.addEventListener('dragover', (e) => e.preventDefault());
                clip.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedIndex !== null && draggedIndex !== index) {
                        const draggedFile = timelineFiles.splice(draggedIndex, 1)[0];
                        timelineFiles.splice(index, 0, draggedFile);
                        if (selectedIndex === draggedIndex) selectedIndex = index;
                        else if (selectedIndex === index) selectedIndex = draggedIndex;
                        renderTimeline();
                    }
                });

                mainTrack.appendChild(clip);
            });
        }

        // PREVIEW SEMUA
        btnPreviewAll.addEventListener('click', () => {
            if (timelineFiles.length === 0) return alert("Masukkan video ke timeline dulu!");
            isPreviewingSequence = true; currentSequenceIndex = 0; playNextInSequence();
        });

        function playNextInSequence() {
            if (currentSequenceIndex >= timelineFiles.length) {
                isPreviewingSequence = false;
                statusBox.innerText = "Preview selesai. Susunan sudah pas?";
                renderTimeline(); return;
            }
            renderTimeline(); 
            statusBox.style.color = "#fde047";
            statusBox.innerText = `Memutar Klip ${currentSequenceIndex + 1} dari ${timelineFiles.length}...`;
            videoPreview.src = URL.createObjectURL(timelineFiles[currentSequenceIndex]);
            videoPreview.play();
        }

        videoPreview.addEventListener('ended', () => {
            if (isPreviewingSequence) { currentSequenceIndex++; playNextInSequence(); }
        });

        // POTONG VIDEO
        btnCut.addEventListener('click', async () => {
            if (selectedIndex === null) return;
            const file = timelineFiles[selectedIndex];
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            btnCut.disabled = true; btnMerge.disabled = true; btnPreviewAll.disabled = true;
            statusBox.style.color = "#fbbf24"; statusBox.innerText = `Memotong klip... Jangan tutup halaman.`;

            try {
                if (!ffmpeg.isLoaded()) await ffmpeg.load();
                const inputName = `temp_in_${Date.now()}.mp4`;
                const outputName = `temp_out_${Date.now()}.mp4`;

                ffmpeg.FS('writeFile', inputName, await fetchFile(file));
                await ffmpeg.run('-i', inputName, '-ss', startTime, '-to', endTime, '-c', 'copy', outputName);

                const videoBlob = new Blob([ffmpeg.FS('readFile', outputName).buffer], { type: 'video/mp4' });
                const newFile = new File([videoBlob], `(Cut) ${file.name}`, { type: 'video/mp4' });
                timelineFiles[selectedIndex] = newFile;
                
                videoPreview.src = URL.createObjectURL(newFile);
                renderTimeline();
                statusBox.style.color = "#4ade80"; statusBox.innerText = "Klip berhasil dipotong!";
            } catch (error) {
                statusBox.style.color = "#ef4444"; statusBox.innerText = "Error memotong video.";
            } finally {
                btnCut.disabled = false; btnMerge.disabled = false; btnPreviewAll.disabled = false;
            }
        });

        // RENDER DAN GABUNG VIDEO (MODE MULUS / FILTER COMPLEX)
        btnMerge.addEventListener('click', async () => {
            if (timelineFiles.length < 2) return alert("Butuh minimal 2 video di timeline untuk digabung!");

            btnCut.disabled = true; btnMerge.disabled = true; btnPreviewAll.disabled = true;
            downloadBtn.style.display = 'none';
            statusBox.style.color = "#fbbf24";
            statusBox.innerText = "Sedang me-render & menjahit video... (Proses ini butuh waktu, harap sabar).";

            try {
                if (!ffmpeg.isLoaded()) await ffmpeg.load();

                let args = [];
                let filterComplex = "";
                let concatStreams = "";

                // Menulis file ke memori dan menyiapkan perintah render HD 720p
                for (let i = 0; i < timelineFiles.length; i++) {
                    const fileName = `merge_${i}.mp4`;
                    ffmpeg.FS('writeFile', fileName, await fetchFile(timelineFiles[i]));
                    args.push('-i', fileName);

                    // Memaksa resolusi seragam (1280x720) dan frame rate seragam (30fps)
                    // Jika ada video tegak, otomatis diberi pinggiran hitam agar tidak gepeng
                    filterComplex += `[${i}:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30[v${i}]; `;
                    concatStreams += `[v${i}][${i}:a]`;
                }

                // Perintah penggabungan setelah diseragamkan
                filterComplex += `${concatStreams}concat=n=${timelineFiles.length}:v=1:a=1[v][a]`;

                args.push('-filter_complex', filterComplex);
                args.push('-map', '[v]', '-map', '[a]');
                args.push('-preset', 'ultrafast'); // Render secepat mungkin untuk mode web
                args.push('output.mp4');

                // Jalankan proses render
                await ffmpeg.run(...args);

                const data = ffmpeg.FS('readFile', 'output.mp4');
                const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(videoBlob);
                
                downloadBtn.href = videoUrl; downloadBtn.download = `Export_Render_Mulus.mp4`; 
                downloadBtn.style.display = 'block';
                videoPreview.src = videoUrl;
                
                statusBox.style.color = "#4ade80"; 
                statusBox.innerText = "Selesai di-render! Video sekarang mulus. Klik tombol unduh.";
            } catch (error) {
                console.error(error);
                statusBox.style.color = "#ef4444"; 
                statusBox.innerText = "Error saat render! Pastikan semua video memiliki suara (audio track).";
            } finally {
                btnCut.disabled = false; btnMerge.disabled = false; btnPreviewAll.disabled = false;
            }
        });

        renderTimeline();
    </script>
</body>
</html>
