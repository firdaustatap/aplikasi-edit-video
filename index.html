<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Web Editor Pro (Live Text Preview)</title>
    <!-- ... (Bagian CSS dan Script FFmpeg sama seperti sebelumnya) ... -->
    <!-- Saya tambahkan style khusus untuk Overlay Teks di bawah -->
    <style>
        /* ... CSS yang lama ... */
        #textOverlayContainer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; align-items: flex-end; justify-content: center;
        }
        .live-text {
            background: rgba(0,0,0,0.6); color: white; padding: 10px 20px; font-size: 24px;
            margin-bottom: 100px; border-radius: 5px; visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="workspace">
        <div class="preview-section">
            <video id="videoPreview" controls></video>
            <!-- Overlay untuk melihat teks secara instan -->
            <div id="textOverlayContainer"><div id="liveText" class="live-text"></div></div>
        </div>
        <!-- ... Panel kanan sama ... -->
    </div>
    <!-- ... Timeline sama ... -->

    <script>
        // ... (Script FFmpeg sama) ...
        
        // Logika Live Preview: Jika video diputar, cek apakah harus memunculkan teks
        videoPreview.addEventListener('timeupdate', () => {
            const currentTime = videoPreview.currentTime;
            const liveText = document.getElementById('liveText');
            
            // Cari apakah ada teks untuk detik ini
            const activeText = textLayers.find(t => currentTime >= t.start && currentTime <= t.end);
            
            if (activeText) {
                liveText.innerText = activeText.text;
                liveText.style.visibility = 'visible';
            } else {
                liveText.style.visibility = 'hidden';
            }
        });
        
        // ... (Fungsi render dan merge sama) ...
    </script>
</body>
</html>
