<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Web Editor Pro - Final</title>
    <script src="coi-serviceworker.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --accent: #2563eb; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; }
        .workspace { display: flex; padding: 10px; gap: 10px; height: 300px; }
        .preview { flex: 2; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        video { max-width: 100%; max-height: 100%; }
        #textOverlay { position: absolute; bottom: 80px; font-size: 24px; background: rgba(0,0,0,0.5); padding: 5px 15px; display: none; }
        .tools { flex: 1; background: var(--panel); padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        button { padding: 10px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; background: var(--accent); }
        .timeline { height: 250px; background: #1a1a1a; padding: 10px; }
        .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: #222; padding: 10px; border-radius: 4px; }
        .content { display: flex; gap: 5px; overflow-x: auto; flex-grow: 1; min-height: 40px; }
        .clip { background: #2563eb; padding: 8px; border-radius: 4px; cursor: grab; font-size: 11px; white-space: nowrap; border: 1px solid #60a5fa; }
        .clip.text { background: #9333ea; border: 1px solid #c084fc; }
    </style>
</head>
<body>
    <header style="padding:10px 20px; font-weight:bold; background:#000;">🎬 Web Editor Pro</header>
    <div class="workspace">
        <div class="preview"><video id="videoPreview" controls></video><div id="textOverlay"></div></div>
        <div class="tools">
            <h3 style="margin:0;">Alat Edit</h3>
            <div style="font-size:11px;">Mulai (s): <input type="number" id="inStart" value="0" style="width:50px;"></div>
            <div style="font-size:11px;">Akhir (s): <input type="number" id="inEnd" value="10" style="width:50px;"></div>
            <button id="btnCut">✂️ Potong Klip Terpilih</button>
            <button id="btnPlayAll" style="background:#ca8a04;">▶️ Play Semua</button>
            <button id="btnMerge" style="background:#16a34a;">🔗 Render & Gabung</button>
            <div id="status" style="font-size:11px; color:#aaa;">Status: Siap.</div>
        </div>
    </div>

    <div class="timeline">
        <div class="row">
            <div style="width:100px; font-weight:bold; font-size:12px;">V1 (Video)</div>
            <input type="file" id="upV" accept="video/mp4" multiple style="display:none;">
            <button onclick="upV.click()" style="width:80px; font-size:11px;">➕ Tambah</button>
            <div class="content" id="trackV"></div>
        </div>
        <div class="row">
            <div style="width:100px; font-weight:bold; font-size:12px;">T1 (Teks)</div>
            <input type="text" id="tText" placeholder="Teks" style="width:80px; font-size:11px;">
            <input type="number" id="tStart" placeholder="Start" style="width:40px; font-size:11px;">
            <input type="number" id="tEnd" placeholder="End" style="width:40px; font-size:11px;">
            <button id="btnAddText" style="width:40px;">+</button>
            <div class="content" id="trackT"></div>
        </div>
    </div>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });
        let vFiles = [], tLayers = [], sel = null, dragIdx = null;

        function render() {
            const trV = document.getElementById('trackV'); trV.innerHTML = '';
            vFiles.forEach((f, i) => {
                const div = document.createElement('div');
                div.className = 'clip'; div.draggable = true; div.innerText = f.name;
                div.ondragstart = () => dragIdx = i;
                div.ondragover = (e) => e.preventDefault();
                div.ondrop = () => { let t = vFiles[dragIdx]; vFiles[dragIdx] = vFiles[i]; vFiles[i] = t; render(); };
                div.onclick = () => { sel = i; document.getElementById('videoPreview').src = URL.createObjectURL(f); };
                trV.appendChild(div);
            });
            const trT = document.getElementById('trackT'); trT.innerHTML = '';
            tLayers.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = 'clip text'; div.innerText = t.text;
                div.onclick = () => { tLayers.splice(i,1); render(); };
                trT.appendChild(div);
            });
        }

        document.getElementById('upV').onchange = (e) => { vFiles.push(...e.target.files); render(); };
        document.getElementById('btnAddText').onclick = () => {
            tLayers.push({text: inText.value, start: tStart.value, end: tEnd.value});
            render();
        };

        document.getElementById('videoPreview').ontimeupdate = (e) => {
            const t = tLayers.find(x => e.target.currentTime >= x.start && e.target.currentTime <= x.end);
            textOverlay.innerText = t ? t.text : ''; textOverlay.style.display = t ? 'block' : 'none';
        };

        document.getElementById('btnPlayAll').onclick = () => {
            let i = 0;
            const play = () => {
                if(i >= vFiles.length) return;
                document.getElementById('videoPreview').src = URL.createObjectURL(vFiles[i]);
                document.getElementById('videoPreview').play();
            };
            document.getElementById('videoPreview').onended = () => { i++; play(); };
            play();
        };

        document.getElementById('btnCut').onclick = async () => {
            if(sel === null) return;
            await ffmpeg.load();
            ffmpeg.FS('writeFile', 'in.mp4', await fetchFile(vFiles[sel]));
            await ffmpeg.run('-i', 'in.mp4', '-ss', cutStart.value, '-to', cutEnd.value, '-c', 'copy', 'out.mp4');
            vFiles[sel] = new File([new Blob([ffmpeg.FS('readFile', 'out.mp4').buffer])], 'cut_'+vFiles[sel].name);
            render();
        };

        document.getElementById('btnMerge').onclick = async () => {
            await ffmpeg.load();
            const font = await fetch('https://cdn.jsdelivr.net/gh/google/fonts/ofl/roboto/Roboto-Bold.ttf').then(r => r.arrayBuffer());
            ffmpeg.FS('writeFile', 'font.ttf', new Uint8Array(font));
            let args = [], filter = "", concat = "";
            for(let i=0; i<vFiles.length; i++) {
                ffmpeg.FS('writeFile', `v${i}.mp4`, await fetchFile(vFiles[i]));
                args.push('-i', `v${i}.mp4`);
                filter += `[${i}:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30[v${i}];`;
                concat += `[v${i}][${i}:a]`;
            }
            filter += `${concat}concat=n=${vFiles.length}:v=1:a=1[v_out][a_out];`;
            let curV = "v_out";
            tLayers.forEach((t, i) => {
                let nextV = `v_t${i}`;
                filter += `[${curV}]drawtext=fontfile=font.ttf:text='${t.text.replace(/'/g, "")}':enable='between(t,${t.start},${t.end})':fontsize=48:x=(w-text_w)/2:y=h-text_h-100[${nextV}];`;
                curV = nextV;
            });
            await ffmpeg.run(...args, '-filter_complex', filter, '-map', `[${curV}]`, '-map', '[a_out]', 'out.mp4');
            const url = URL.createObjectURL(new Blob([ffmpeg.FS('readFile', 'out.mp4').buffer]));
            document.getElementById('downloadBtn').href = url; document.getElementById('downloadBtn').style.display = 'block';
        };
    </script>
</body>
</html>
