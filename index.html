<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Web Editor Pro</title>
    <script src="coi-serviceworker.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; margin: 0; }
        .flex { display: flex; gap: 10px; padding: 10px; }
        .preview { flex: 2; background: #000; height: 300px; display: flex; align-items: center; justify-content: center; position: relative; }
        .controls { flex: 1; background: #1e1e1e; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .timeline { background: #1a1a1a; padding: 15px; min-height: 200px; }
        .clip { background: #2563eb; padding: 10px; border-radius: 4px; cursor: grab; margin-right: 5px; font-size: 12px; display: inline-block; }
        button { padding: 10px; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="flex">
        <div class="preview"><video id="vid" controls style="width:100%"></video></div>
        <div class="controls">
            <button id="btnPlay" style="background:#ca8a04;">▶️ Play Semua Urutan</button>
            <button id="btnMerge" style="background:#16a34a;">🔗 Render & Gabung</button>
            <div id="status" style="font-size:12px; color:#aaa;">Status: Siap.</div>
        </div>
    </div>
    <div class="timeline">
        <button onclick="document.getElementById('up').click()">➕ Tambah Video</button>
        <input type="file" id="up" multiple style="display:none;">
        <div id="track" style="margin-top:10px; display:flex; gap:10px; overflow-x:auto;"></div>
    </div>
    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });
        let files = [], dragIdx = null;

        function render() {
            const track = document.getElementById('track'); track.innerHTML = '';
            files.forEach((f, i) => {
                const div = document.createElement('div');
                div.className = 'clip'; div.draggable = true; div.innerText = f.name;
                div.ondragstart = () => dragIdx = i;
                div.ondragover = (e) => e.preventDefault();
                div.ondrop = () => { let t = files[dragIdx]; files[dragIdx] = files[i]; files[i] = t; render(); };
                div.onclick = () => document.getElementById('vid').src = URL.createObjectURL(f);
                track.appendChild(div);
            });
        }

        document.getElementById('up').onchange = (e) => { files.push(...e.target.files); render(); };
        
        document.getElementById('btnPlay').onclick = () => {
            let i = 0;
            const p = () => {
                if(i >= files.length) return;
                document.getElementById('vid').src = URL.createObjectURL(files[i]);
                document.getElementById('vid').play();
            };
            document.getElementById('vid').onended = () => { i++; p(); };
            p();
        };

        document.getElementById('btnMerge').onclick = async () => {
            document.getElementById('status').innerText = "Memproses...";
            await ffmpeg.load();
            let args = [], filter = "", concat = "";
            for(let i=0; i<files.length; i++) {
                ffmpeg.FS('writeFile', `v${i}.mp4`, await fetchFile(files[i]));
                args.push('-i', `v${i}.mp4`);
                filter += `[${i}:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30[v${i}];`;
                concat += `[v${i}][${i}:a]`;
            }
            await ffmpeg.run(...args, '-filter_complex', filter + `${concat}concat=n=${files.length}:v=1:a=1[v][a]`, '-map', '[v]', '-map', '[a]', 'out.mp4');
            const url = URL.createObjectURL(new Blob([ffmpeg.FS('readFile', 'out.mp4').buffer]));
            document.getElementById('status').innerHTML = `<a href="${url}" download="hasil.mp4">⬇️ Klik untuk Unduh</a>`;
        };
    </script>
</body>
</html>
