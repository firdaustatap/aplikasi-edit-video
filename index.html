<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Web Editor Pro (Final Stable)</title>
    <script src="coi-serviceworker.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --accent: #2563eb; --text: #fff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .workspace { display: flex; padding: 10px; gap: 10px; height: 350px; }
        .preview-section { flex: 2; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        video { max-width: 100%; max-height: 100%; }
        #textOverlay { position: absolute; bottom: 80px; font-size: 24px; background: rgba(0,0,0,0.5); padding: 5px 15px; display: none; }
        .tools { flex: 1; background: var(--panel); padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        button { padding: 10px; background: var(--accent); color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .timeline { height: 250px; background: #1a1a1a; padding: 10px; overflow-y: auto; }
        .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: #222; padding: 5px; border-radius: 4px; }
        .content { display: flex; gap: 5px; overflow-x: auto; flex-grow: 1; min-height: 50px; }
        .clip { background: #2563eb; padding: 10px; border-radius: 4px; cursor: grab; font-size: 12px; white-space: nowrap; }
        .clip.text { background: #9333ea; }
    </style>
</head>
<body>
    <header style="padding:10px 20px; font-weight:bold; background:#000;">🎬 Web Editor Pro</header>
    <div class="workspace">
        <div class="preview-section">
            <video id="videoPreview" controls></video>
            <div id="textOverlay"></div>
        </div>
        <div class="tools">
            <h3 style="margin:0;">Alat Render</h3>
            <button id="btnMerge" style="background:#16a34a;">🔗 Render & Gabung Video</button>
            <a id="downloadBtn" style="display:none; text-align:center; color:#4ade80; text-decoration:none;">⬇️ Klik Untuk Unduh</a>
            <div id="statusBox" style="font-size:12px; color:#aaa;">Status: Siap.</div>
        </div>
    </div>

    <div class="timeline">
        <!-- V1 TRACK -->
        <div class="row">
            <div style="width:120px; font-size:12px; font-weight:bold;">V1 (Video)</div>
            <input type="file" id="upV" accept="video/mp4" multiple style="display:none;">
            <button style="width:100px;" onclick="upV.click()">➕ Video</button>
            <div class="content" id="trackV"></div>
        </div>
        <!-- T1 TRACK -->
        <div class="row">
            <div style="width:120px; font-size:12px; font-weight:bold;">T1 (Teks)</div>
            <input type="text" id="inText" placeholder="Teks" style="width:80px;">
            <input type="number" id="inStart" placeholder="Mulai(s)" style="width:60px;">
            <input type="number" id="inEnd" placeholder="Akhir(s)" style="width:60px;">
            <button id="btnAddText" style="width:50px;">+</button>
            <div class="content" id="trackT"></div>
        </div>
    </div>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });
        let vFiles = [], tLayers = [], dragIdx = null;

        function render() {
            const vTrack = document.getElementById('trackV'); vTrack.innerHTML = '';
            vFiles.forEach((f, i) => {
                const div = document.createElement('div');
                div.className = 'clip'; div.draggable = true; div.innerText = f.name;
                div.ondragstart = () => dragIdx = i;
                div.ondragover = (e) => e.preventDefault();
                div.ondrop = () => {
                    let temp = vFiles[dragIdx]; vFiles[dragIdx] = vFiles[i]; vFiles[i] = temp;
                    render();
                };
                div.onclick = () => document.getElementById('videoPreview').src = URL.createObjectURL(f);
                vTrack.appendChild(div);
            });
            const tTrack = document.getElementById('trackT'); tTrack.innerHTML = '';
            tLayers.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = 'clip text'; div.innerText = t.text;
                div.onclick = () => { tLayers.splice(i,1); render(); };
                tTrack.appendChild(div);
            });
        }

        document.getElementById('upV').onchange = (e) => { vFiles.push(...e.target.files); render(); };
        document.getElementById('btnAddText').onclick = () => {
            tLayers.push({text: inText.value, start: inStart.value, end: inEnd.value});
            render();
        };

        // Live Preview Teks
        document.getElementById('videoPreview').ontimeupdate = (e) => {
            const t = tLayers.find(x => e.target.currentTime >= x.start && e.target.currentTime <= x.end);
            textOverlay.innerText = t ? t.text : '';
            textOverlay.style.display = t ? 'block' : 'none';
        };

        document.getElementById('btnMerge').onclick = async () => {
            await ffmpeg.load();
            const font = await fetch('https://cdn.jsdelivr.net/gh/google/fonts/ofl/roboto/Roboto-Bold.ttf').then(r => r.arrayBuffer());
            ffmpeg.FS('writeFile', 'font.ttf', new Uint8Array(font));
            
            let args = [], filter = "", concat = "";
            for(let i=0; i<vFiles.length; i++) {
                ffmpeg.FS('writeFile', `v${i}.mp4`, await fetchFile(vFiles[i]));
                args.push('-i', `v${i}.mp4`);
                filter += `[${i}:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30[v${i}];`;
                concat += `[v${i}][${i}:a]`;
            }
            filter += `${concat}concat=n=${vFiles.length}:v=1:a=1[v_out][a_out];`;
            
            // Add Text Filter
            let currentV = "v_out";
            tLayers.forEach((t, i) => {
                let nextV = `v_text${i}`;
                filter += `[${currentV}]drawtext=fontfile=font.ttf:text='${t.text.replace(/'/g, "")}':enable='between(t,${t.start},${t.end})':fontsize=48:x=(w-text_w)/2:y=h-text_h-100[${nextV}];`;
                currentV = nextV;
            });
            
            await ffmpeg.run(...args, '-filter_complex', filter, '-map', `[${currentV}]`, '-map', '[a_out]', 'out.mp4');
            const url = URL.createObjectURL(new Blob([ffmpeg.FS('readFile', 'out.mp4').buffer]));
            downloadBtn.href = url; downloadBtn.style.display = 'block'; downloadBtn.innerText = "⬇️ Unduh Hasil Render";
        };
    </script>
</body>
</html>
